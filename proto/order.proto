syntax = "proto3";

package order;
option go_package = "github.com/bharathbbg/order-service/proto/order";

import "common.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse) {}
  rpc GetOrder(GetOrderRequest) returns (OrderResponse) {}
  rpc UpdateOrder(UpdateOrderRequest) returns (OrderResponse) {}
  rpc DeleteOrder(DeleteOrderRequest) returns (DeleteOrderResponse) {}
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {}
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  common.Money unit_price = 3;
}

message Order {
  string id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  common.Address shipping_address = 4;
  string status = 5;
  common.Money total_price = 6;
  common.Timestamp created_at = 7;
  common.Timestamp updated_at = 8;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItem items = 2;
  common.Address shipping_address = 3;
}

message GetOrderRequest {
  string id = 1;
}

message UpdateOrderRequest {
  string id = 1;
  string status = 2;
  common.Address shipping_address = 3;
}

message DeleteOrderRequest {
  string id = 1;
}

message DeleteOrderResponse {
  bool success = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message OrderResponse {
  Order order = 1;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}